<!doctype html>
<html lang="id">

    <meta name="theme-color" content="#0b0a0d" />

    <title>404 · Candid Cam</title>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600&amp;family=Playfair+Display:ital,wght@1,500&amp;family=JetBrains+Mono:wght@500&amp;display=swap" />
    <style>
      html, body { margin: 0; height: 100%; background: #0b0a0d; color: #f4efe6; font-family: 'Instrument Sans', system-ui, sans-serif; }
      main { min-height: 100%; display: grid; place-items: center; align-content: center; gap: 14px; text-align: center; padding: 24px; box-sizing: border-box; }
      .code { font: 500 13px 'JetBrains Mono', monospace; letter-spacing: 0.3em; color: #e0a94a; }
      h1 { margin: 0; font: italic 500 clamp(30px, 6vw, 44px)/1.1 'Playfair Display', serif; }
      p { margin: 0; color: rgba(244, 239, 230, 0.6); max-width: 360px; }
      a { margin-top: 10px; color: #0b0a0d; background: #f4efe6; text-decoration: none; font-weight: 600; padding: 13px 24px; border-radius: 99px; }
      .roll { width: 70px; height: 70px; border-radius: 50%; border: 1px dashed rgba(255, 255, 255, 0.25); display: grid; place-items: center; }
    </style>
  </head>
  <body>
    <main>
      <span class="roll"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#e0a94a" stroke-width="1.5" stroke-linecap="round"><rect x="4.5" y="3.5" width="15" height="17" rx="1.5"/><path d="M8 3.5v17M16 3.5v17"/></svg></span>
      <span class="code">404 · FRAME HILANG</span>
      <h1>Halaman ini tidak ada di roll.</h1>
      <p>Periksa lagi tautan atau QR yang kamu pindai. Mungkin acaranya sudah dihapus atau tautannya berubah.</p>
      <a href="/">Ke halaman utama</a>
    </main>
  </body>
</html>
