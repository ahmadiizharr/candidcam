# cam.mangaisekai.com -> Candid Cam (FastAPI :8092). Lewat Cloudflare (proxied).
# Cloudflare "Always Use HTTPS" aktif, jadi tantangan ACME juga dilayani di :443.

# Satu venue = biasanya satu IP WiFi untuk semua tamu, jadi batas upload dibuat longgar.
# Hanya POST yang dihitung, supaya galeri yang di-refresh banyak tamu tidak ikut dibatasi.
map $request_method $cc_upload_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $cc_upload_key zone=cc_upload:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=cc_all:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=cc_auth:10m rate=10r/m;

server {
    listen 80;
    server_name cam.mangaisekai.com;
    include /etc/nginx/cloudflare-realip.conf;

    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name cam.mangaisekai.com;
    include /etc/nginx/cloudflare-realip.conf;
    limit_req_status 429;

    ssl_certificate /etc/letsencrypt/live/cam.mangaisekai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cam.mangaisekai.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    # Foto tamu maks 15 MB di backend.
    client_max_body_size 20m;

    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }

    # Upload foto tamu dan sampul acara.
    location ~ ^/api/(g/[a-z0-9-]+/photos|events/[0-9a-f]+/cover)$ {
        limit_req zone=cc_upload burst=60 nodelay;
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Login/daftar host dan passcode display: tebakan dibatasi per IP.
    location ~ ^/api/(auth/(login|register)|display/[0-9a-f]+/unlock)$ {
        limit_req zone=cc_auth burst=6 nodelay;
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ZIP semua foto bisa besar dan lama dibuat.
    location ~ ^/api/events/[0-9a-f]+/photos\.zip$ {
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_buffering off;
    }

    # Aset hasil build Vite ber-hash dan foto (nama acak, tidak pernah berubah).
    location ~ ^/(assets|media)/ {
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1y;
    }

    location / {
        limit_req zone=cc_all burst=200 nodelay;
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
